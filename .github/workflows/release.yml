name: Release

on:
  push:
    tags: [v*]

# Minimal default — only build and checksums jobs need write
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Quality gates ──────────────────────────────────────────────────
  checks:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: reeln-dock

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: StreamnDad/reeln-core
          path: reeln-core

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reeln-dock/package-lock.json

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: reeln-dock/src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev pkg-config

      - name: Frontend checks
        working-directory: reeln-dock
        run: |
          npm ci
          npm run check
          npm run test

      - name: Rust checks
        working-directory: reeln-dock/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # ── Multi-platform builds ──────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - label: Windows
            platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    env:
      FFMPEG_BUILD: autobuild-2026-05-13-13-53
      FFMPEG_ZIP: ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: reeln-dock

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: StreamnDad/reeln-core
          path: reeln-core

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reeln-dock/package-lock.json

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: reeln-dock/src-tauri

      # ── System dependencies ──────────────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libavcodec-dev libavformat-dev libavfilter-dev libavdevice-dev \
            libavutil-dev libswscale-dev libswresample-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Cache FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ffmpeg-cache
        with:
          path: ffmpeg
          key: ffmpeg-win64-shared-7.1-${{ env.FFMPEG_BUILD }}

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ env.FFMPEG_BUILD }}/${{ env.FFMPEG_ZIP }}" \
            -o ffmpeg.zip
          curl -fsSL \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ env.FFMPEG_BUILD }}/${{ env.FFMPEG_ZIP }}.sha256" \
            -o ffmpeg.zip.sha256
          sha256sum --check ffmpeg.zip.sha256
          7z x ffmpeg.zip
          mv ffmpeg-n7.1-latest-win64-gpl-shared-7.1 ffmpeg

      - name: Set FFmpeg env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "FFMPEG_DIR=${GITHUB_WORKSPACE}/ffmpeg" >> $GITHUB_ENV
          echo "${GITHUB_WORKSPACE}/ffmpeg/bin" >> $GITHUB_PATH

      # ── Build ────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: reeln-dock
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: reeln-dock
          tagName: v__VERSION__
          releaseName: "reeln-dock v__VERSION__"
          releaseBody: |
            See assets below to download and install.

            ## Checksums
            SHA-256 checksums are in `SHA256SUMS.txt`.

            ## Install
            | Platform | File |
            |----------|------|
            | macOS (Intel + Apple Silicon) | `.dmg` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (all distros) | `.AppImage` |
            | Windows | `.msi` or `.exe` |
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── Checksums ──────────────────────────────────────────────────────
  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern "*.dmg" \
            --pattern "*.deb" \
            --pattern "*.AppImage" \
            --pattern "*.msi" \
            --pattern "*.exe" \
            --pattern "*.tar.gz" \
            --pattern "*.sig"

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * | sort -k2 > SHA256SUMS.txt
          echo "## SHA-256 Checksums"
          cat SHA256SUMS.txt

      - name: Upload checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release upload "$tag" \
            artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
