version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "JRemitz"
    assignees:
      - "JRemitz"

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "JRemitz"
    assignees:
      - "JRemitz"

  - package-ecosystem: "docker"
    directory: "/.github"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "JRemitz"
    assignees:
      - "JRemitz"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "JRemitz"
    assignees:
      - "JRemitz"
